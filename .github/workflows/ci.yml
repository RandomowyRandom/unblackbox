name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # scripts skipped: tests and the typecheck need no browser, voice model or native builds
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npx --yes @anthropic-ai/claude-code plugin validate .
